  <section style="padding-top: 9rem;">
    <div class="container contact-layout reveal">
      <div>
        <h1 style="margin-bottom:1.5rem;">Contact</h1>

        <form action="https://formspree.io/f/maqrajkn" method="POST">
          <div class="form-field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn" type="submit">Send message</button>
        </form>
      </div>

      <img class="photo" src="images/mauve-dimpled-bud-vase.jpg" alt="Mauve bud vase with a dimpled texture" />
    </div>
  </section>
